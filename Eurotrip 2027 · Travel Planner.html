<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>Eurotrip 2027 · Travel Planner</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf6ef;--card:#fff;--ink:#3a3733;--mut:#8a8378;--sage:#7f9a84;--sage2:#e6ede6;--rose:#d4a5a5;--rose2:#f6e8e6;--gold:#b8975a;--line:#eadfd0;--bad:#c0605a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#1c1a18;--card:#262320;--ink:#efe9df;--mut:#a39b8e;--sage2:#2c3a2f;--rose2:#3a2a2a;--line:#3a3530}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#1c1a18;--card:#262320;--ink:#efe9df;--mut:#a39b8e;--sage2:#2c3a2f;--rose2:#3a2a2a;--line:#3a3530}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif;overflow-x:hidden}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;margin:.2em 0}h1{font-size:2rem}h2{font-size:1.45rem;color:var(--gold)}h3{font-size:1.15rem}
aside{position:fixed;left:0;top:0;bottom:0;width:210px;background:var(--card);border-right:1px solid var(--line);padding:18px 10px;overflow:auto;display:none}
aside .logo{font-family:'Cormorant Garamond',Georgia,serif;font-size:1.3rem;color:var(--gold);padding:0 10px 12px}
.nv{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;color:var(--ink);padding:9px 12px;border-radius:10px;font:inherit;cursor:pointer;text-align:left}.nv.on,.nv:hover{background:var(--rose2)}
main{padding:14px 14px 100px;max-width:1100px;margin:0 auto}
#bot{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
#bot button{flex:1;border:0;background:none;color:var(--mut);padding:8px 0;font:11px Inter,sans-serif;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px}#bot span{font-size:20px}#bot .on{color:var(--gold);font-weight:600}

.top{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:8px}
input,select,textarea,button{font:inherit;color:var(--ink)}input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:42px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 1px 6px #0000000a}
details.card{padding:0}details.card>summary{list-style:none;padding:14px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center}summary::-webkit-details-marker{display:none}
summary small{display:block;color:var(--mut)}summary .r{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}summary b{overflow-wrap:anywhere}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;padding:0 14px 10px}.f span{display:block;font-size:12px;color:var(--mut);margin-bottom:2px}.f.w{grid-column:1/-1}
.ck{display:flex;gap:8px;align-items:center;min-height:42px}.ck input{width:22px;height:22px;min-height:0;accent-color:var(--sage);flex:none}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}.cols .card{margin:0}
.big{font-family:'Cormorant Garamond',Georgia,serif;font-size:3.4rem;line-height:1;color:var(--gold)}.mut{color:var(--mut);font-size:13px}.tot{font-size:1.35rem;font-weight:600}
.bar{height:9px;background:var(--line);border-radius:9px;overflow:hidden;margin:5px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sage),var(--gold));border-radius:9px}
.bd{font-size:11.5px;border-radius:20px;padding:2px 9px;background:var(--bg);border:1px solid var(--line);white-space:nowrap}
.btn{border:1px solid var(--gold);background:var(--card);border-radius:12px;padding:10px 14px;cursor:pointer;min-height:42px}.btn.p{background:var(--gold);color:#fff}.del{margin:0 14px 14px;border:0;background:none;color:var(--bad);cursor:pointer;padding:8px 0}
.al{padding:10px 12px;border-radius:12px;margin:6px 0;background:var(--rose2);border-left:4px solid var(--rose)}.al.bad{border-color:var(--bad)}.al.ok{background:var(--sage2);border-color:var(--sage)}
.tl{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:6px}.tl button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 4px;font-size:11px;text-align:center;cursor:pointer;color:var(--ink)}.tl b{display:block;font-size:13px}.tl .d{border-color:var(--sage);background:var(--sage2)}.tl .c{border-color:var(--bad)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chips button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:7px 12px;cursor:pointer}.chips .on{background:var(--gold);color:#fff;border-color:var(--gold)}
.row{display:flex;gap:8px;align-items:center}.row input[type=text]{flex:1}.row .ck{flex:none;min-height:0}.hr{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line)}
.hb{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:13px}.hb b{width:110px;flex:none;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hb .bar{flex:1;margin:0}.hb em{font-style:normal;width:92px;text-align:right;flex:none}
.dn{width:130px;height:130px;border-radius:50%;margin:auto}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center;font-size:12px}.cal div{padding:5px 0;border-radius:8px}.cal .e{background:var(--rose2);font-weight:600}.cal .z{color:var(--mut)}
textarea{resize:vertical}pre{white-space:pre-wrap}
@media(min-width:900px){aside{display:block}#bot{display:none}main{margin-left:230px;padding-bottom:40px;max-width:1100px}}
@media(max-width:899px){.big{font-size:3rem}}

return`<h1>Países</h1><div class="chips">${Object.entries(PAIS).map(([k,v])=>{const n=need().filter(([s,i])=>pais(i.cidade)===k),d=n.filter(([s,i])=>done(i)).length;return`<button class="${k===c?'on':''}" data-a="pais" data-v="${k}">${v[0]} ${v[1]} · ${pc(d,n.length)}%</button>`}).join('')}</div>
<div class="card"><h2>${fl} ${nm}</h2><div class="cols"><div><div class="mut">Reservas</div>${bar(pc(dn,nd.length))}<b>${dn}/${nd.length}</b></div><div><div class="mut">Noites</div><b>${hs.reduce((a,h)=>a+nts(h),0)}</b> em ${[...new Set(hs.map(h=>h.cidade))].join(', ')||'—'}</div><div><div class="mut">Custo projetado</div><b class="tot">${R(f.pais[c]||0)}</b></div></div></div>
<h2>Hospedagem</h2>${hs.map(h=>card('hotels',h)).join('')||'<p class="mut">—</p>'}<h2>Transportes</h2>${srt(all.filter(([s])=>s==='transp').map(x=>x[1]),'transp').map(i=>card('transp',i)).join('')||'<p class="mut">—</p>'}
<h2>Atrações e restaurantes</h2>${srt(all.filter(([s])=>s==='attr').map(x=>x[1]),'attr').map(i=>card('attr',i)).join('')||'<p class="mut">—</p>'}${ckBlock(c,'Checklist — '+nm)}
<h2>Informações úteis</h2>${S.info.filter(i=>i.g===nm).map(i=>gcard('info',i,i.t,'',esc(i.v).slice(0,30))).join('')}<button class="btn" data-a="add" data-v="info:${nm}">+ Informação sobre ${nm}</button>`}
function reservas(){const ev=need().filter(([s,i])=>!done(i)).sort((a,b)=>((a[1].abre||dt(...a)||'9').localeCompare(b[1].abre||dt(...b)||'9'))||((b[1].pri==='a')-(a[1].pri==='a'))),ls=recs().filter(([s,i])=>rtab(s,i)===V.rt&&hit(s,i)).sort((a,b)=>(dt(...a)||'9').localeCompare(dt(...b)||'9'));
return`<h1>Reservas</h1><h2>Próximas reservas</h2>${ev.slice(0,8).map(([s,i])=>`<div class="al"><b>${esc(ttl(s,i))}</b> · ${fd(dt(s,i))}${i.abre?' · abre '+fd(i.abre):''} ${bd(i.st)}</div>`).join('')||'<div class="al ok">Nada pendente 🎉</div>'}
<div class="chips">${RT.map(t=>`<button class="${t===V.rt?'on':''}" data-a="rt" data-v="${t}">${t} (${recs().filter(([s,i])=>rtab(s,i)===t).length})</button>`).join('')}</div>${ls.map(([s,i])=>card(s,i)).join('')||'<p class="mut">Nenhuma reserva nesta categoria.</p>'}<p class="mut">Para adicionar: use Transportes, Hotéis ou Atrações (restaurantes e eventos são “categorias” de Atrações).</p>`}
function gastos(){const f=fin(),n=N(S.cfg.n)||1,mx=a=>Math.max(1,...a),cats=CATS.map(c=>[c,f.cat[c].r]),cp=Object.entries(f.pais),cc=Object.entries(f.cid).sort((a,b)=>b[1]-a[1]),pal=['#b8975a','#7f9a84','#d4a5a5','#c9b79c','#9fb3a3','#e0c3a0','#a88b8b','#8d9b7a','#d8cbb8','#6f7f73'];let acc=0;const tot=f.real||1;
const dn=`conic-gradient(${cats.map(([c,v],i)=>{const a=acc/tot*100;acc+=v;return`${pal[i]} ${a}% ${acc/tot*100}%`}).join(',')})`;
const bars=(a,m)=>a.map(([k,v])=>`<div class="hb"><b>${k}</b>${bar(pc(v,m))}<em>${R(v)}</em></div>`).join('');
return`<div class="top"><h1>Gastos</h1></div><div class="cols"><div class="card"><div class="mut">Orçamento estimado</div><div class="tot">${R(f.prev)}</div></div><div class="card"><div class="mut">Valor real / projetado</div><div class="tot">${R(f.real)}</div></div><div class="card"><div class="mut">Pago</div><div class="tot">${R(f.pago)}</div></div><div class="card"><div class="mut">Pendente</div><div class="tot">${R(f.pend)}</div></div><div class="card"><div class="mut">Por pessoa (${n})</div><div class="tot">${R(f.real/n)}</div></div></div>
<h2>Por categoria</h2><div class="card"><div class="dn" style="background:${dn}"></div><br>${bars(cats,mx(cats.map(c=>c[1])))}<p class="mut">Categorias sem itens usam o orçamento editável abaixo; gastos lançados a partir dele substituem a estimativa quando maiores.</p>
<div class="cols">${Object.keys(S.orc).map(k=>`<label class="f"><span>Orçamento — ${k} (BRL)</span><input type="number" step="any" value="${S.orc[k]}" data-s="orc" data-k="${k}"></label>`).join('')}</div></div>
<h2>Por país</h2><div class="card">${bars(cp,mx(cp.map(c=>c[1])))}</div><h2>Por cidade</h2><div class="card">${bars(cc,mx(cc.map(c=>c[1])))}</div>
<h2>Pagamentos e prazos</h2>${tb('pay','Pagamento')}${srt(S.pay.filter(p=>hit('pay',p)),'pay').map(p=>gcard('pay',p,p.item,fd(p.venc)+' · '+esc(p.cat),`<span class="bd">${p.pago?'🟢 Pago':'🔴 Pendente'}</span><b>${R(p.val)}</b>`)).join('')}
<h2>Gastos lançados</h2>${tb('gastos','Gasto')}${srt(S.gastos.filter(g=>hit('gastos',g)),'gastos').map(g=>gcard('gastos',g,g.desc||'Gasto',fd(g.data)+' · '+g.cat+(g.cidade?' · '+esc(g.cidade):''),`<b>${g.moeda} ${N(g.val).toFixed(2)}</b><span class="mut">${R(N(g.val)*fx(g.moeda))}${g.pago?' · pago':''}</span>`)).join('')||'<p class="mut">Nenhum gasto ainda — os gastos da viagem entram aqui (ou em “Hoje”).</p>'}`}
function checklist(){return`<h1>Checklist</h1>${['Documentos','Antes da viagem','Mala'].map(g=>ckBlock(g,g)).join('')}<h2>Por país</h2><div class="cols">${Object.entries(PAIS).map(([k,v])=>ckBlock(k,v[0]+' '+v[1])).join('')}</div>`}
const lst=(s,l,t)=>`<h1>${t}</h1>${tb(s,l)}${srt(S[s].filter(i=>hit(s,i)),s).map(i=>card(s,i)).join('')||'<p class="mut">Nada encontrado.</p>'}`;
function atracoes(){const pr=V.pr||'',cs=[...new Set(S.attr.map(a=>a.cidade))];return`<h1>Atrações</h1>${tb('attr','Atração')}<div class="chips">${[['','Todas'],['a','⭐ Imperdível'],['m','♡ Quero conhecer'],['o','○ Se der tempo']].map(([k,l])=>`<button class="${pr===k?'on':''}" data-a="pr" data-v="${k}">${l}</button>`).join('')}</div>${cs.map(c=>{const a=srt(S.attr.filter(x=>x.cidade===c&&hit('attr',x)&&(!pr||x.pri===pr)),'attr');return a.length?`<h2>${esc(c)||'Sem cidade'}</h2>${a.map(i=>card('attr',i)).join('')}`:''}).join('')}`}
function cal(){const e=events(),td=TODAY(),fut=e.filter(x=>x.d>=td&&!x.done&&x.k!=='cin').slice(0,10),ms=[...new Set(e.map(x=>x.d.slice(0,7)))],K={abre:'🔓',lim:'⏰',canc:'↩️',cin:'🏨',ing:'🎫',pay:'💳'};
return`<h1>Calendário de reservas e prazos</h1><h2>Próximas ações</h2>${fut.map(x=>`<div class="al ${x.d<=td?'bad':''}"><b>${fd(x.d)}</b> ${K[x.k]} ${esc(x.t)}</div>`).join('')||'<div class="al ok">Sem ações pendentes. Cadastre datas de abertura/limite nas reservas.</div>'}
${ms.map(m=>{const y=+m.slice(0,4),mo=+m.slice(5)-1,f=new Date(y,mo,1).getDay(),nd=new Date(y,mo+1,0).getDate(),ev=e.filter(x=>x.d.startsWith(m));return`<h2>${['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'][mo]} ${y}</h2><div class="card"><div class="cal">${WD.map(w=>`<div class="z">${w}</div>`).join('')}${'<div></div>'.repeat(f)}${Array.from({length:nd},(_,k)=>{const d=m+'-'+String(k+1).padStart(2,'0');return`<div class="${ev.some(x=>x.d===d)?'e':''}">${k+1}</div>`}).join('')}</div>${ev.map(x=>`<div class="hr"><span>${K[x.k]} ${esc(x.t)}</span><span class="mut">${fd(x.d)} ${x.done?'✓':''}</span></div>`).join('')}</div>`}).join('')}`}
function docs(){return`<h1>Documentos e vouchers</h1>${tb('docs','Documento')}${S.docs.filter(d=>hit('docs',d)).map(d=>gcard('docs',d,d.nome,esc(d.cat)+(d.onde?' · '+esc(d.onde):''),d.ok?'✅':'⬜')).join('')}`}
function info(){return`<h1>Informações importantes</h1><h2>Dados dos hotéis</h2>${S.hotels.filter(h=>inc(h)).map(h=>`<div class="card"><b>${esc(h.nome)}</b> · ${esc(h.cidade)}<br>${esc(h.end||'endereço pendente')}${h.tel?' · '+esc(h.tel):''}<br><span class="mut">${fd(h.cin)}→${fd(h.cout)} · ${esc(h.loc||'sem localizador')}</span></div>`).join('')}
${[...GI,...Object.values(PAIS).map(p=>p[1])].map(g=>{const a=S.info.filter(i=>i.g===g&&hit('info',i));return a.length?`<h2>${g}</h2>${a.map(i=>gcard('info',i,i.t,'',esc(i.v).slice(0,40))).join('')}`:''}).join('')}<button class="btn p" data-a="add" data-v="info">+ Informação</button>`}
function dados(){const c=S.cfg,fl=(k,l,t='number')=>`<label class="f"><span>${l}</span><input type="${t}" step="any" value="${esc(c[k])}" data-s="cfg" data-k="${k}"></label>`;
return`<h1>Dados e configuração</h1><div class="card"><div class="grid" style="padding:0">${fl('start','Início da viagem','date')}${fl('end','Fim da viagem','date')}${fl('n','Nº de viajantes')}${fl('eur','Cotação EUR → BRL')}${fl('chf','Cotação CHF → BRL')}${[1,2,3,4].map(i=>fl('n'+i,'Viajante '+i,'text')).join('')}</div></div>
<div class="card"><h3>Backup</h3><p class="mut">Os dados ficam salvos neste navegador. Copie o backup abaixo e guarde em um lugar seguro; para restaurar, cole e importe.</p><textarea id="bk" rows="5" placeholder="Cole aqui um backup para importar"></textarea><div class="top" style="margin-top:8px"><button class="btn p" data-a="exp">Gerar e copiar backup</button><button class="btn" data-a="imp">Importar backup</button><button class="btn" style="color:var(--bad)" data-a="reset">Resetar dados</button></div></div>`}
const P=[['home','🏠','Início',home],['rot','🗺','Roteiro',roteiro],['hoje','📅','Hoje',hoje],['pais','🌍','Países',paises],['chk','✅','Checklist',checklist],['gas','€','Gastos',gastos],['res','🎫','Reservas',reservas],['hot','🏨','Hotéis',()=>lst('hotels','Hotel','Hospedagens')],['tra','🚆','Transportes',()=>lst('transp','Transporte','Transportes')],['atr','⭐','Atrações',atracoes],['cal','🗓','Prazos',cal],['doc','📁','Documentos',docs],['inf','ℹ️','Informações',info],['dad','⚙️','Dados',dados]];
let cur='home';
function render(){const y=scrollY;$('#main').innerHTML='<div class="top"><input type="search" id="q" placeholder="🔍 Pesquisar…" value="'+esc(V.q)+'"></div>'+P.find(p=>p[0]===cur)[3]();
const nv=(p,c)=>`<button class="${c} ${p[0]===cur?'on':''}" data-a="go" data-v="${p[0]}">${c==='nv'?p[1]+' '+p[2]:`<span>${p[1]}</span>${p[2]}`}</button>`;
$('#side').innerHTML='<div class="logo">Eurotrip 2027</div>'+P.map(p=>nv(p,'nv')).join('');$('#bot').innerHTML=['home','rot','hoje','chk','gas'].map(k=>nv(P.find(p=>p[0]===k),'')).join('')+'<button data-a="more"><span>⋯</span>Mais</button>';
$('#sheetin').innerHTML=P.map(p=>`<button data-a="go" data-v="${p[0]}">${p[1]}<br>${p[2]}</button>`).join('');scrollTo(0,y);const qi=$('#q');if(V.fq){qi.focus();qi.setSelectionRange(99,99)}}
const NEW={transp:()=>({tipo:'Trem',moeda:'EUR',val:0,ind:true,pes:+S.cfg.n,st:'ns',inc:true}),hotels:()=>({moeda:'EUR',base:0,taxas:0,pes:+S.cfg.n,st:'ns',inc:true,nome:'Nova hospedagem'}),attr:()=>({nome:'Nova atração',cat:'Cultural',pri:'m',moeda:'EUR',val:0,pes:+S.cfg.n,as:'Planejada',st:'ns',inc:true}),gastos:()=>({data:TODAY(),cat:'Alimentação',moeda:'EUR',val:0,pes:+S.cfg.n,desc:'Novo gasto'}),pay:()=>({item:'Novo pagamento',val:0,pago:false}),docs:()=>({cat:'Outros',nome:'Novo documento',ok:false}),info:()=>({g:'Observações pessoais',t:'Nova informação',v:''})};
document.addEventListener('change',e=>{const t=e.target,a=t.dataset;if(a.a==='ord'){V.ord=t.value;return render()}if(a.a==='pf'){V.pf=t.value;return render()}if(a.a==='hd'){V.hd=t.value;return render()}if(!a.s)return;
const v=t.type==='checkbox'?t.checked:t.type==='number'?(t.value===''?'':+t.value):t.value;
if(a.s==='cfg')S.cfg[a.k]=v;else if(a.s==='orc')S.orc[a.k]=N(v);else{const it=S[a.s].find(x=>x.id===a.i);if(!it)return;it[a.k]=v;
if(a.s==='pay'&&a.k==='pago'){if(v&&!it.dt)it.dt=TODAY();if(it.ref){const[s,id]=it.ref.split(':'),h=S[s].find(x=>x.id===id);if(h)h.st=S.pay.filter(x=>x.ref===it.ref).every(x=>x.pago)?'pg':h.st==='pg'?'rs':h.st}}}
save();render()});
document.addEventListener('input',e=>{if(e.target.id==='q'){V.q=e.target.value;V.fq=1;clearTimeout(V.t);V.t=setTimeout(render,250)}});
document.addEventListener('focusout',e=>{if(e.target.id==='q')V.fq=0});
document.addEventListener('toggle',e=>{const o=e.target.dataset&&e.target.dataset.o;if(o)e.target.open?OP.add(o):OP.delete(o)},true);
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.tagName==='SELECT')return;const a=b.dataset.a,v=b.dataset.v;
if(a==='go'){cur=v;$('#sheet').classList.remove('on');V.q='';render();scrollTo(0,0)}
else if(a==='more')$('#sheet').classList.add('on');
else if(a==='day'){V.hd=v;cur='hoje';render();scrollTo(0,0)}
else if(a==='pais'){V.pais=v;render()}else if(a==='rt'){V.rt=v;render()}else if(a==='pr'){V.pr=v;render()}
else if(a==='add'){const[s,g]=v.split(':'),it={id:uid(),...NEW[s]()};if(g)it.g=g;S[s].unshift(it);OP.add(s+it.id);save();render()}
else if(a==='del'){const[s,id]=v.split(':');if(s==='ck'||confirm('Remover este item?')){S[s]=S[s].filter(x=>x.id!==id);save();render()}}
else if(a==='addck'){const el=$('#n-'+v.replace(/\W/g,''));if(el&&el.value.trim()){S.ck.push({id:uid(),g:v,t:el.value.trim(),d:false});save();render()}}
else if(a==='qg'){const d=V.hd||TODAY(),t=$('#qg-d').value,x=$('#qg-v').value;if(t&&x){const dy=S.days.find(z=>z.d===d);S.gastos.push({id:uid(),data:d,desc:t,cat:'Alimentação',cidade:dy?dy.cid.split(' → ').pop():'',moeda:'EUR',val:+x,pes:+S.cfg.n,pago:true});save();render()}}
else if(a==='exp'){const s=JSON.stringify(S);$('#bk').value=s;try{navigator.clipboard.writeText(s)}catch(_){}$('#bk').select()}
else if(a==='imp'){try{const x=JSON.parse($('#bk').value);if(!x.cfg||!x.days)throw 0;if(confirm('Substituir todos os dados atuais pelo backup?')){S=x;save();render()}}catch(_){alert('Backup inválido.')}}
else if(a==='reset'){if(confirm('Apagar TODAS as alterações e voltar aos dados originais da planilha?')&&prompt('Digite RESETAR para confirmar')==='RESETAR'){S=JSON.parse(JSON.stringify(DATA));save();render()}}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id&&e.target.id.startsWith('n-')){const b=e.target.parentElement.querySelector('[data-a=addck]');b&&b.click()}});
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')e.target.classList.remove('on')});
render();
</script></body></html>
